name: GUT tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot download
        id: cache
        uses: actions/cache@v4
        with:
          path: godot.zip
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot if needed
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o godot.zip "https://downloads.godotengine.org/?version=${{ env.GODOT_VERSION }}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"

      - name: Extract Godot
        run: |
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64

      - name: Run GUT tests
        run: |
          ./godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 --headless --path . -s addons/gut/gut_cmdln.gd -gexit
